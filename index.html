<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tarkov Seasonal Document Tracker</title>
<style>
:root{--bg:#101214;--panel:#181b1f;--panel2:#20242a;--line:#343941;--text:#e9ecef;--muted:#9da5ae;--accent:#d6b36a;--good:#7fc58a;--danger:#d87878}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(135deg,#0d0f11,#171a1e);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
.wrap{max-width:1100px;margin:auto;padding:28px 18px 50px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:22px}
h1{font-size:28px;margin:0 0 6px;letter-spacing:.3px}
.subtitle{color:var(--muted);font-size:14px}
button{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:8px;padding:9px 13px;cursor:pointer;font-weight:600}
button:hover{filter:brightness(1.15)}
.reset{color:#f0b2b2}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
.card{background:rgba(24,27,31,.95);border:1px solid var(--line);border-radius:12px;padding:17px}
.card .label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.8px}
.card .value{font-size:25px;font-weight:800;margin-top:5px}
.progressbox{margin-bottom:20px}
.progress{height:13px;background:#0d0f11;border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar{height:100%;width:0;background:var(--accent);transition:width .2s}
.percent{display:flex;justify-content:space-between;margin-top:8px;color:var(--muted);font-size:13px}
table{width:100%;border-collapse:separate;border-spacing:0;background:rgba(24,27,31,.96);border:1px solid var(--line);border-radius:12px;overflow:hidden}
th,td{padding:13px 12px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;background:#1d2025}
tr:last-child td{border-bottom:0}
.name{font-weight:750}
.location{color:#c1c7ce;font-size:13px}
.num{text-align:center;font-variant-numeric:tabular-nums}
.controls{display:flex;align-items:center;justify-content:center;gap:8px}
.controls button{width:34px;height:34px;padding:0;font-size:18px}
.acquired{min-width:42px;text-align:center;font-weight:800}
.missing{font-weight:800}
.missing.done{color:var(--good)}
.exchange{margin-top:18px;background:rgba(24,27,31,.96);border:1px solid var(--line);border-radius:12px;padding:16px}
.exchange strong{color:var(--accent)}
.note{color:var(--muted);font-size:13px;margin-top:6px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.needed-input{width:65px;padding:7px 5px;border:1px solid var(--line);border-radius:7px;background:#0d0f11;color:var(--text);text-align:center;font-weight:700}
.needed-input:focus{outline:1px solid var(--accent)}
@media(max-width:720px){
 header{align-items:flex-start;flex-direction:column}
 .summary{grid-template-columns:1fr}
 table{font-size:13px}
 th:nth-child(2),td:nth-child(2){display:none}
 th,td{padding:10px 7px}
}
.ampm.active{background:#fff;color:#111;border-color:#fff;box-shadow:0 0 0 1px #fff inset}

/* 숫자 입력창의 브라우저 기본 위/아래 스피너 제거 */
.needed-input::-webkit-outer-spin-button,
.needed-input::-webkit-inner-spin-button,
.time-part::-webkit-outer-spin-button,
.time-part::-webkit-inner-spin-button {
  -webkit-appearance: none;
  margin: 0;
}
.needed-input,
.time-part {
  -moz-appearance: textfield;
  appearance: textfield;
}

</style>
</head>
<body>
<div class="wrap">
<header>
  <div>
    <h1>Escape from Tarkov — Document Tracker</h1>
    <div class="subtitle">시즌 문서 수집 현황을 기록합니다. 진행 상황은 이 브라우저에 자동 저장됩니다.</div>
  </div>
  <div class="actions">
    <button onclick="exportData()">백업 내보내기</button>
    <button onclick="triggerImport()">백업 불러오기</button>
    <button class="reset" onclick="resetData()">전체 초기화</button>
    <input id="importFile" type="file" accept="application/json,.json" hidden onchange="importData(this)">
  </div>
</header>

<section class="summary">
  <div class="card"><div class="label">전체 필요 수량</div><div class="value" id="totalNeeded">0</div></div>
  <div class="card"><div class="label">획득 완료</div><div class="value" id="totalAcquired">0</div></div>
  <div class="card"><div class="label">남은 문서</div><div class="value" id="totalMissing">0</div></div>
</section>

<section class="card progressbox">
  <div class="label">전체 진행률</div>
  <div class="progress"><div class="bar" id="bar"></div></div>
  <div class="percent"><span id="progressText">0%</span><span id="fraction">0 / 0</span></div>
</section>

<table>
<thead><tr><th>Document</th><th>Location</th><th class="num">Needed</th><th class="num">Acquired</th><th class="num">추가 필요</th></tr></thead>
<tbody id="rows"></tbody>
</table>
<div class="reset-timer card">
  <div class="label">문서 리셋 시계</div>
  <div class="timer-settings">
    <label>시작/리셋 시간</label>
    <div class="ampm-buttons">
      <button id="amBtn" class="ampm active" onclick="setAmPm('AM')">오전</button>
      <button id="pmBtn" class="ampm" onclick="setAmPm('PM')">오후</button>
    </div>
    <input id="resetHour" class="time-part" type="number" min="1" max="12" value="12" aria-label="시간">
    <span class="time-separator">시</span>
    <input id="resetMinute" class="time-part minute" type="number" min="0" max="59" value="00" aria-label="분">
    <span class="time-separator">분</span>
    <button onclick="startResetTimer()">24시간 시작</button>
    <button onclick="resetTimer()">시계 리셋</button>
  </div>
  <div id="timerStatus" class="timer-status">원하는 시간을 설정하고 24시간 카운트를 시작하세요.</div>
  <div id="countdown" class="countdown">--:--:--</div>
</div>


</div>

<script>
const DATA = [
  ["Financial","Customs, Streets, Interchange",0],
  ["PMC Personal","Reserve, Lighthouse, Icebreaker",0],
  ["Project","Factory, Reserve, Customs",0],
  ["Blueprints","Interchange, Factory, Labyrinth",0],
  ["Test","Shoreline, Woods, Icebreaker",0],
  ["User","Ground Zero, Streets, Labs",0],
  ["Medical","Labs, Ground Zero, Labyrinth",0],
  ["Technical","Shoreline, Woods, Lighthouse",0]
];

const KEY="tarkov-document-tracker-v1";
const NEEDED_KEY="tarkov-document-needed-v1";
let acquired=JSON.parse(localStorage.getItem(KEY)||"{}");
let needed=JSON.parse(localStorage.getItem(NEEDED_KEY)||"null");
if(!Array.isArray(needed) || needed.length!==DATA.length) needed=DATA.map(d=>d[2]);
function save(){localStorage.setItem(KEY,JSON.stringify(acquired));}
function saveNeeded(){localStorage.setItem(NEEDED_KEY,JSON.stringify(needed));}
function changeNeeded(i,delta){
  const current=Number(needed[i])||0;
  const n=Math.max(0,current+Number(delta));
  needed[i]=n;
  if((Number(acquired[i])||0)>n) acquired[i]=n;
  saveNeeded(); save(); render();
}
function setNeeded(i,value){
  const n=Math.max(0,Math.floor(Number(String(value).replace(/[^0-9]/g,''))||0));
  needed[i]=n;
  if((Number(acquired[i])||0)>n) acquired[i]=n;
  saveNeeded(); save(); render();
}
function clamp(n,max){return Math.max(0,Math.min(max,n));}
function setAcquired(i,value){
  const max=Number(needed[i])||0;
  const n=Math.max(0,Math.min(max,Math.floor(Number(value)||0)));
  acquired[i]=n;
  save(); render();
}
function change(i,delta){
  const max=Number(needed[i])||0;
  const current=Number(acquired[i])||0;
  const n=Math.max(0,Math.min(max,current+Number(delta)));
  acquired[i]=n;
  save(); render();
}
function render(){
  const rows=document.getElementById("rows");
  rows.innerHTML="";
  let total=0, got=0;
  DATA.forEach((d,i)=>{
    const a=Number(acquired[i])||0, m=Math.max(0,(Number(needed[i])||0)-a);
    total+=needed[i]; got+=a;
    const tr=document.createElement("tr");
    tr.innerHTML=`
      <td class="name">${d[0]}</td>
      <td class="location">${d[1]}</td>
      <td class="num"><div class="needed-controls">
        <button aria-label="필요 수량 감소" onclick="changeNeeded(${i},-1)">−</button>
        <input class="needed-input" type="text" inputmode="numeric" value="${needed[i]}"
          onchange="setNeeded(${i},this.value)" aria-label="필요 수량">
        <button aria-label="필요 수량 증가" onclick="changeNeeded(${i},1)">+</button>
      </div></td>
      <td class="num"><div class="controls">
        <button aria-label="감소" onclick="change(${i},-1)">−</button>
        <input class="needed-input" type="text" inputmode="numeric" value="${a}"
          onchange="setAcquired(${i},this.value)" aria-label="획득 수량">
        <button aria-label="증가" onclick="change(${i},1)">+</button>
      </div></td>
      <td class="num missing ${m===0?'done':''}">${m}</td>`;
    rows.appendChild(tr);
  });
  const missing=total-got, pct=total?got/total*100:0;
  document.getElementById("totalNeeded").textContent=total;
  document.getElementById("totalAcquired").textContent=got;
  document.getElementById("totalMissing").textContent=missing;
  document.getElementById("bar").style.width=pct+"%";
  document.getElementById("progressText").textContent=pct.toFixed(1)+"%";
  document.getElementById("fraction").textContent=got+" / "+total;
}
function resetData(){
  if(confirm("모든 필요한 수량과 획득 수량을 0으로 초기화할까요?")){
    needed=DATA.map(d=>0);
    acquired={};
    localStorage.removeItem(NEEDED_KEY);
    localStorage.removeItem(KEY);
    saveNeeded();
    save();
    render();
  }
}

const TIMER_KEY="tarkov-document-reset-timer-v1";
let resetTimerEnd=Number(localStorage.getItem(TIMER_KEY)||0);
let timerInterval=null;

let selectedAmPm="AM";
function setAmPm(value){
  selectedAmPm=value;
  document.getElementById("amBtn").classList.toggle("active",value==="AM");
  document.getElementById("pmBtn").classList.toggle("active",value==="PM");
}

function startResetTimer(){
  let h=Number(document.getElementById("resetHour").value);
  let m=Number(document.getElementById("resetMinute").value);
  if(!Number.isInteger(h) || h<1 || h>12){ alert("시간은 1시부터 12시까지 입력해주세요."); return; }
  if(!Number.isInteger(m) || m<0 || m>59){ alert("분은 0분부터 59분까지 입력해주세요."); return; }

  if(selectedAmPm==="AM") h=(h===12)?0:h;
  else h=(h===12)?12:h+12;

  const now=new Date();
  const start=new Date(now);
  start.setHours(h,m,0,0);
  if(start<=now) start.setDate(start.getDate()+1);
  resetTimerEnd=start.getTime()+24*60*60*1000;
  localStorage.setItem(TIMER_KEY,String(resetTimerEnd));
  updateTimer();
}

function resetTimer(){
  resetTimerEnd=0;
  localStorage.removeItem(TIMER_KEY);
  updateTimer();
}

function updateTimer(){
  const status=document.getElementById("timerStatus");
  const countdown=document.getElementById("countdown");
  if(!status || !countdown) return;
  if(!resetTimerEnd){
    status.textContent="원하는 시간을 설정하고 24시간 카운트를 시작하세요.";
    status.className="timer-status";
    countdown.textContent="--:--:--";
    return;
  }
  const remain=resetTimerEnd-Date.now();
  if(remain<=0){
    status.textContent="문서 초기화 됨";
    status.className="timer-status timer-done";
    countdown.textContent="00:00:00";
    return;
  }
  const total=Math.floor(remain/1000);
  const hh=Math.floor(total/3600);
  const mm=Math.floor((total%3600)/60);
  const ss=total%60;
  countdown.textContent=[hh,mm,ss].map(v=>String(v).padStart(2,"0")).join(":");
  status.textContent="설정한 시간부터 24시간 후 문서가 초기화됩니다.";
  status.className="timer-status";
}

function runTimer(){
  updateTimer();
  if(timerInterval) clearInterval(timerInterval);
  timerInterval=setInterval(updateTimer,1000);
}

const BACKUP_VERSION=2;

function exportData(){
  const payload={
    format:"tarkov-document-tracker",
    version:BACKUP_VERSION,
    exportedAt:new Date().toISOString(),
    documents:DATA.map(d=>d[0]),
    needed:DATA.map((d,i)=>Number(needed[i])||0),
    acquired:DATA.map((d,i)=>Number(acquired[i])||0),
    resetTimerEnd:Number(resetTimerEnd)||0
  };
  const stamp=new Date();
  const pad=v=>String(v).padStart(2,"0");
  const name=`tarkov-document-backup-${stamp.getFullYear()}${pad(stamp.getMonth()+1)}${pad(stamp.getDate())}-${pad(stamp.getHours())}${pad(stamp.getMinutes())}.json`;
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=name;
  a.click();
  URL.revokeObjectURL(a.href);
}

function triggerImport(){
  const input=document.getElementById("importFile");
  if(input) input.click();
}

function toCount(value){
  const n=Math.floor(Number(value));
  return (Number.isFinite(n) && n>0) ? n : 0;
}

function parseBackup(raw){
  let obj;
  try{ obj=JSON.parse(raw); }
  catch(e){ return {error:"JSON 형식이 아닙니다. 내보내기로 받은 파일이 맞는지 확인해주세요."}; }
  if(!obj || typeof obj!=="object" || Array.isArray(obj)) return {error:"백업 파일 내용을 읽을 수 없습니다."};

  // 구버전 백업: 획득 수량만 담긴 객체 {"0":3,"1":1,...}
  const isLegacy = !("needed" in obj) && !("acquired" in obj);
  const src = isLegacy ? obj : obj.acquired;
  if(src===undefined || src===null) return {error:"백업 파일에 획득 수량이 없습니다."};

  const nextNeeded=DATA.map((d,i)=>{
    if(isLegacy) return Number(needed[i])||0;   // 구버전엔 필요 수량이 없으니 현재 값 유지
    return toCount(Array.isArray(obj.needed) ? obj.needed[i] : (obj.needed||{})[i]);
  });
  const nextAcquired=DATA.map((d,i)=>{
    const v=toCount(Array.isArray(src) ? src[i] : src[i]);
    return Math.min(v,nextNeeded[i]);
  });

  let nextTimer=Number(obj.resetTimerEnd);
  if(!Number.isFinite(nextTimer) || nextTimer<0) nextTimer=0;

  return {legacy:isLegacy, needed:nextNeeded, acquired:nextAcquired, resetTimerEnd:nextTimer};
}

function applyBackup(data){
  needed=data.needed;
  acquired={};
  data.acquired.forEach((v,i)=>{ acquired[i]=v; });
  resetTimerEnd=data.resetTimerEnd;
  saveNeeded();
  save();
  if(resetTimerEnd) localStorage.setItem(TIMER_KEY,String(resetTimerEnd));
  else localStorage.removeItem(TIMER_KEY);
  render();
  runTimer();
}

function importData(input){
  const file=input && input.files && input.files[0];
  if(!file){ return; }
  const reader=new FileReader();
  reader.onload=()=>{
    const parsed=parseBackup(String(reader.result));
    input.value="";                       // 같은 파일 다시 선택 가능하게
    if(parsed.error){ alert(parsed.error); return; }
    const total=parsed.acquired.reduce((a,b)=>a+b,0);
    const goal=parsed.needed.reduce((a,b)=>a+b,0);
    const extra=parsed.legacy ? "\n(구버전 백업이라 필요 수량과 타이머는 지금 값을 유지합니다.)" : "";
    if(!confirm(`백업을 불러오면 현재 기록을 덮어씁니다.\n불러올 내용: ${total} / ${goal}${extra}\n계속할까요?`)) return;
    applyBackup(parsed);
  };
  reader.onerror=()=>{ input.value=""; alert("파일을 읽지 못했습니다."); };
  reader.readAsText(file);
}
render();
runTimer();
</script>
</body>
</html>
